name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Pas de DATABASE_URL ici : backend/tests/conftest.py la positionne
      # lui-meme sur test_postrack.db avant tout import de l'app, ce qui
      # garantit qu'aucune base de developpement n'est touchee.
      - name: Variables d'environnement de test
        run: |
          echo "ENVIRONMENT=testing" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-test-secret-key-not-for-production" >> $GITHUB_ENV

      - name: Lancer la suite
        run: pytest -q --tb=short

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build